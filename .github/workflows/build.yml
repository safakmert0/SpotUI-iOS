name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List generated files
        run: |
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj found"
          ls -la *.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No schemes found"

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project SpotUI.xcodeproj \
            -scheme SpotUI \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -configuration Debug \
            -derivedDataPath build/Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -50

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpotUI-iOS-Build
          path: build/Debug/Build/Products/Debug-iphonesimulator/SpotUI.app
          retention-days: 7
